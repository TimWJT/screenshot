name: release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The installer and the portable exe are built and attached to a DRAFT release,
# which you review and publish by hand from the Releases page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to a commit, so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        run: cargo test --release
        timeout-minutes: 10

      - name: Build
        run: cargo build --release

      - name: Version
        id: version
        shell: bash
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # The version lives in three files; refuse to release if they or the tag disagree.
          rc="$(grep -m1 '"ProductVersion"' assets/app.rc | cut -d'"' -f4)"
          manifest="$(grep -m1 'assemblyIdentity type="win32" name="TimWJT' assets/app.manifest | sed -E 's/.*version="([0-9.]+)".*/\1/')"
          fail=0
          [[ "$rc" == "$v" ]] || { echo "::error::assets/app.rc says $rc, Cargo.toml says $v"; fail=1; }
          [[ "$manifest" == "$v.0" ]] || { echo "::error::assets/app.manifest says $manifest, Cargo.toml says $v"; fail=1; }
          grep -q "FILEVERSION ${v//./,},0" assets/app.rc || { echo "::error::FILEVERSION in assets/app.rc is not ${v//./,},0"; fail=1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; fail=1
          fi
          [[ $fail == 0 ]] || exit 1
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} installer\screenshot.iss
          Copy-Item target\release\screenshot.exe "dist\Screenshot_${{ steps.version.outputs.version }}_x64-portable.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-${{ steps.version.outputs.version }}
          path: dist/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Screenshot ${{ github.ref_name }}'
          draft: true
          files: dist/*
          body: |
            ## Which file do I download?

            | You want | Download the file ending in |
            |---|---|
            | **Install it** (Start menu, starts with Windows) | **`_x64-setup.exe`** |
            | **No install**, just run it | **`_x64-portable.exe`** |

            Windows 10 or 11, 64-bit.

            ### "Windows protected your PC"?

            The app is free and not code-signed, so Windows warns once. Click **More info**, then **Run anyway**.
